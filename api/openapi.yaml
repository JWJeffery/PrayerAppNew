openapi: 3.0.3
info:
  title: The Universal Office -- Parish Intercessions API
  version: "1.0.0"
  description: |
    Standalone, versioned JSON API for rector-managed intercessory prayer lists. Bearer tokens only
    (no cookies), no CORS. Hand-maintained: `scripts/audit-parish-intentions.mjs` fails if a route in
    `api/src/bootstrap.php` is missing from this file. Written for the web client today and the future
    native app tomorrow.

    Conventions: timestamps are ISO-8601 UTC with `Z`. Errors are `{"error": "<code>", "message": "<text>"}`
    (422 adds `fields`). Error codes: bad_request 400, unauthorized 401 (and code_required 401), forbidden 403,
    not_found 404, conflict / limit_reached 409, invalid_input 422, rate_limited 429, server_error 500.
    Email-based endpoints answer identically whether or not an address is known (no enumeration).
servers:
  - url: https://theuniversaloffice.com/api/v1
components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      description: Session token from POST /auth/verify-code (30 days, absolute).
    adminToken:
      type: http
      scheme: bearer
      description: Session token from POST /admin/auth/verify-code, POST /auth/password-login (as admin) or POST /passkey/login (as admin).
    dioceseToken:
      type: http
      scheme: bearer
      description: Diocese editor session token from POST /diocese/auth/verify-code, POST /auth/password-login (as diocese) or POST /passkey/login (as diocese).
    readerToken:
      type: http
      scheme: bearer
      description: Reader session token from POST /reader/verify-code, POST /auth/password-login (as reader) or POST /passkey/login (as reader).
    anyToken:
      type: http
      scheme: bearer
      description: Any signed-in session (reader, rector or helper, diocese editor, administrator).
    parishPass:
      type: apiKey
      in: header
      name: X-Parish-Pass
      description: Reader pass from POST /parishes/{slug}/join. Needed only for parishes whose visibility is "code".
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    Ok:
      type: object
      properties:
        status: { type: string, example: ok }
    Category:
      type: string
      enum: [individual, family, situation, institution]
    Visibility:
      type: string
      enum: [public, code]
    ParishListing:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        diocese_key: { type: string, nullable: true }
        corpus_parish_slug: { type: string, nullable: true, description: Links to the app's Diocesan Cycle of Prayer parish entry. }
        visibility: { $ref: "#/components/schemas/Visibility" }
    ReaderIntention:
      type: object
      properties:
        id: { type: integer }
        category: { $ref: "#/components/schemas/Category" }
        text: { type: string, maxLength: 200, description: Plain text. Clients MUST render it as text, never as markup. }
        expires_at: { type: string, format: date-time }
    StaffIntention:
      type: object
      properties:
        id: { type: integer }
        category: { $ref: "#/components/schemas/Category" }
        text: { type: string, maxLength: 200 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        extension_count: { type: integer }
        expired: { type: boolean, description: True for requests expired within the last 7 days (kept until purged). }
    EmailBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    CodeBody:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, example: "123456" }
    Generic:
      type: object
      description: Identical body for every email, known or not.
      properties:
        status: { type: string }
    SessionAnswer:
      type: object
      properties:
        token: { type: string, description: "Bearer token, 64 hex characters; keep it, send it in the Authorization header." }
        expires_at: { type: string, format: date-time }
        principal: { type: string, enum: [reader, staff, admin, diocese] }
        account: { $ref: "#/components/schemas/AccountSummary" }
    AccountSummary:
      type: object
      properties:
        email: { type: string }
        has_password: { type: boolean }
        passkeys: { type: integer }
    AccountAnswer:
      type: object
      properties:
        account: { $ref: "#/components/schemas/AccountSummary" }
    ParishPage:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        diocese_key: { type: string, nullable: true }
        rector_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        website: { type: string, nullable: true, description: "http(s) address only." }
        service_times: { type: array, items: { type: string }, maxItems: 8 }
    ParishEvent:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 120 }
        date: { type: string, format: date, description: "The parish's own calendar date." }
        time: { type: string, nullable: true, example: "19:00", description: "The parish's own 24-hour wall-clock time." }
        note: { type: string, nullable: true, maxLength: 200 }
    ParishAnnouncement:
      type: object
      properties:
        id: { type: integer }
        text: { type: string, maxLength: 300 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
  responses:
    Unauthorized:
      description: Missing, invalid or expired token; or a wrong/expired code.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Wrong principal or role for this endpoint.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found (including another parish's item).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: Validation failed; `fields` maps field to message.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests. Honour the Retry-After header.
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /health:
    get:
      summary: Liveness check (no database).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }
  /parishes:
    get:
      summary: Approved parishes (pending and suspended never appear).
      parameters:
        - { name: diocese, in: query, required: false, schema: { type: string }, description: "Diocese key, e.g. episcopal/western-oregon." }
      responses:
        "200":
          description: Up to 200, alphabetical.
          content: { application/json: { schema: { type: object, properties: { parishes: { type: array, items: { $ref: "#/components/schemas/ParishListing" } } } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /parishes/{slug}:
    get:
      summary: A parish's home page -- service times, rector, address, website, current announcements and coming events. Same visibility rule as intentions.
      security: [ {}, { parishPass: [] } ]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: X-Parish-Pass, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Cacheable for 60 seconds (private). Events stay listed through the day after their date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  parish: { $ref: "#/components/schemas/ParishPage" }
                  events: { type: array, items: { $ref: "#/components/schemas/ParishEvent" } }
                  announcements: { type: array, items: { type: object, properties: { id: { type: integer }, text: { type: string }, expires_at: { type: string, format: date-time } } } }
                  generated_at: { type: string, format: date-time }
        "401": { description: "error code_required -- this parish needs a join code pass.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /dioceses/{body}/{name}:
    get:
      summary: A diocese's page -- bishop, website, convention dates, the bishop's unexpired prayer list, and its approved parishes.
      parameters:
        - { name: body, in: path, required: true, schema: { type: string }, description: "Body slug, e.g. episcopal." }
        - { name: name, in: path, required: true, schema: { type: string }, description: "Diocese slug, e.g. western-oregon." }
      responses:
        "200":
          description: Cacheable for 5 minutes (public). A diocese nobody has configured answers with empty fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  diocese: { type: object, properties: { key: { type: string }, bishop_name: { type: string, nullable: true }, website: { type: string, nullable: true }, convention_dates: { type: array, items: { type: string } } } }
                  prayers: { type: array, items: { type: object, properties: { id: { type: integer }, text: { type: string }, expires_at: { type: string, format: date-time } } } }
                  parishes: { type: array, items: { $ref: "#/components/schemas/ParishListing" } }
                  generated_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /parishes/{slug}/intentions:
    get:
      summary: A parish's current, unexpired requests (ordered by category, then creation).
      security: [ {}, { parishPass: [] } ]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: X-Parish-Pass, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: Cacheable for 60 seconds (private).
          content:
            application/json:
              schema:
                type: object
                properties:
                  parish: { type: object, properties: { slug: { type: string }, name: { type: string } } }
                  intentions: { type: array, items: { $ref: "#/components/schemas/ReaderIntention" } }
                  generated_at: { type: string, format: date-time }
        "401": { description: "error code_required -- this parish needs a join code pass.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /parishes/{slug}/join:
    post:
      summary: Exchange a join code for a reader pass (valid while the code is unchanged, max 365 days).
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, example: ABCD-EFGH } } } } }
      responses:
        "200":
          description: Pass issued.
          content: { application/json: { schema: { type: object, properties: { pass: { type: string }, parish: { type: object, properties: { slug: { type: string }, name: { type: string } } } } } } }
        "400": { description: "Bad request, or the parish is public and needs no code.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Code not accepted (generic), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /register:
    post:
      summary: Start a parish registration; emails a 6-digit code. Always answers the same 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parish_name, contact_name, email]
              properties:
                parish_name: { type: string, maxLength: 160 }
                contact_name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                diocese_key: { type: string }
                corpus_parish_slug: { type: string, pattern: "^[a-z0-9-]{1,80}$" }
                visibility: { $ref: "#/components/schemas/Visibility" }
      responses:
        "200": { description: Generic acknowledgement., content: { application/json: { schema: { $ref: "#/components/schemas/Generic" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /register/verify:
    post:
      summary: Confirm the email code; creates the pending parish and its rector and notifies the administrator.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CodeBody" } } } }
      responses:
        "200": { description: Awaiting administrator approval., content: { application/json: { schema: { type: object, properties: { status: { type: string, example: pending_approval } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /reader/request-code:
    post:
      summary: Email a 6-digit code to any valid address, to sign in or create a reader account. The answer never says whether the address already has an account.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "200": { description: A code has been sent if the address is valid., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /reader/verify-code:
    post:
      summary: Exchange the emailed code for a reader session. The first correct code creates the account.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string } } } } }
      responses:
        "200": { description: Signed in., content: { application/json: { schema: { $ref: "#/components/schemas/SessionAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /reader/profile:
    get:
      summary: The reader's saved settings (decrypted for them only).
      security: [ { readerToken: [] } ]
      responses:
        "200": { description: The settings, or null when none are saved yet., content: { application/json: { schema: { type: object, properties: { profile: { type: object, nullable: true, additionalProperties: true }, updated_at: { type: string, format: date-time, nullable: true } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      summary: Replace the saved settings. Plain values only (strings up to 600 characters, numbers, booleans, null), at most 60 keys and 7000 bytes. Stored encrypted.
      security: [ { readerToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { type: object, additionalProperties: true } } } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { type: object, properties: { updated_at: { type: string, format: date-time } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /auth/password-login:
    post:
      summary: Sign in with an email address and password. `as` chooses the role. One generic 401 for every failure (wrong password, unknown address, a role the address does not hold).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, password, as], properties: { email: { type: string }, password: { type: string }, as: { type: string, enum: [reader, staff, admin, diocese] } } } } }
      responses:
        "200": { description: Signed in., content: { application/json: { schema: { $ref: "#/components/schemas/SessionAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/social:
    post:
      summary: Sign in with another provider (Apple, Google, Facebook). Switched off until a provider is enabled in the private config; every provider answers 400 provider_unavailable today.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider, id_token, as], properties: { provider: { type: string }, id_token: { type: string }, as: { type: string, enum: [reader, staff, admin, diocese] } } } } }
      responses:
        "200": { description: Signed in., content: { application/json: { schema: { $ref: "#/components/schemas/SessionAnswer" } } } }
        "400": { description: "provider_unavailable.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /passkey/login/options:
    post:
      summary: Options for navigator.credentials.get. No address is needed and nothing reveals which addresses have passkeys. Binary fields are base64url.
      responses:
        "200": { description: A one-time token and the public-key options., content: { application/json: { schema: { type: object, properties: { token: { type: string }, publicKey: { type: object, additionalProperties: true } } } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /passkey/login:
    post:
      summary: Finish a passkey sign-in with the browser's assertion (base64url fields). `as` chooses the role.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, as, id, clientDataJSON, authenticatorData, signature], properties: { token: { type: string }, as: { type: string, enum: [reader, staff, admin, diocese] }, id: { type: string }, clientDataJSON: { type: string }, authenticatorData: { type: string }, signature: { type: string } } } } }
      responses:
        "200": { description: Signed in., content: { application/json: { schema: { $ref: "#/components/schemas/SessionAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/reauth/request-code:
    post:
      summary: Email a code to confirm it is really the account holder (needed when the sign-in is more than 15 minutes old).
      security: [ { anyToken: [] } ]
      responses:
        "200": { description: Sent., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/reauth:
    post:
      summary: Confirm with the emailed code. The session then counts as just confirmed for 15 minutes.
      security: [ { anyToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "200": { description: Confirmed., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/password:
    post:
      summary: Add or change the password (15 to 128 characters, any characters, no composition rules, not common). Needs a recent sign-in or `current_password`; otherwise 403 reauth_required. Signs out every other session for the address.
      security: [ { anyToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string }, current_password: { type: string } } } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/AccountAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "reauth_required.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Remove the password. Same confirmation rule; signs out every other session.
      security: [ { anyToken: [] } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { current_password: { type: string } } } } }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { $ref: "#/components/schemas/AccountAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "reauth_required.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /account/passkeys:
    get:
      summary: The account's passkeys (label and dates only).
      security: [ { anyToken: [] } ]
      responses:
        "200": { description: The list., content: { application/json: { schema: { type: object, properties: { passkeys: { type: array, items: { type: object, properties: { id: { type: integer }, label: { type: string, nullable: true }, created_at: { type: string, format: date-time }, last_used_at: { type: string, format: date-time, nullable: true } } } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Finish adding a passkey with the browser's attestation (base64url fields). At most 10 per account. Needs a recent sign-in or `current_password`.
      security: [ { anyToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, clientDataJSON, attestationObject], properties: { token: { type: string }, clientDataJSON: { type: string }, attestationObject: { type: string }, label: { type: string }, current_password: { type: string } } } } }
      responses:
        "201": { description: Added., content: { application/json: { schema: { $ref: "#/components/schemas/AccountAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "reauth_required.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "limit_reached.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /account/passkeys/options:
    post:
      summary: Options for navigator.credentials.create (a resident key with user verification, attestation none). Needs a recent sign-in or `current_password`.
      security: [ { anyToken: [] } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { current_password: { type: string } } } } }
      responses:
        "200": { description: A one-time token and the public-key options., content: { application/json: { schema: { type: object, properties: { token: { type: string }, publicKey: { type: object, additionalProperties: true } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "reauth_required.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /account/passkeys/{id}:
    delete:
      summary: Remove one of your passkeys. Needs a recent sign-in or `current_password`.
      security: [ { anyToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { $ref: "#/components/schemas/AccountAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "reauth_required.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /account:
    delete:
      summary: A reader deletes their account, saved settings and sessions (and password and passkeys, unless the address also holds a parish or administrator role). Needs a recent sign-in or `current_password`.
      security: [ { readerToken: [] } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { current_password: { type: string } } } } }
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/request-code:
    post:
      summary: Email a staff login code (only sent to staff of approved parishes). Identical response either way.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmailBody" } } } }
      responses:
        "200": { description: Generic acknowledgement., content: { application/json: { schema: { $ref: "#/components/schemas/Generic" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify-code:
    post:
      summary: Exchange a code for a session token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CodeBody" } } } }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
