        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /diocese/prayers:
    post:
      summary: Add an item to the editor's own diocese's prayer list (1-200 characters; `days` 1-45, default 21; at most 60).
      security: [ { dioceseToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 200 }, days: { type: integer, minimum: 1, maximum: 45, default: 21 } } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { prayer: { type: object, properties: { id: { type: integer }, text: { type: string } } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "limit_reached -- 60 items.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /diocese/prayers/{id}:
    delete:
      summary: Remove an item from the editor's own diocese's prayer list.
      security: [ { dioceseToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/dioceses/{body}/{name}/editors:
    get:
      summary: The people designated to keep this diocese's page (administrator).
      security: [ { adminToken: [] } ]
      parameters:
        - { name: body, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The editors., content: { application/json: { schema: { type: object, properties: { editors: { type: array, items: { type: object, properties: { id: { type: integer }, email: { type: string }, added_at: { type: string, format: date-time } } } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Designate an editor for this diocese (administrator). One address keeps at most one diocese. They are emailed how to sign in.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: body, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmailBody" } } } }
      responses:
        "201": { description: Added., content: { application/json: { schema: { type: object, properties: { editor: { type: object, properties: { id: { type: integer }, email: { type: string } } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: That address already keeps a diocesan page., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /admin/diocese-editors/{id}:
    delete:
      summary: Remove a diocese editor (administrator). Their sessions end at once.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/admins:
    get:
      summary: The administrator list -- owners (set in the private config) and administrators designated in the app.
      security: [ { adminToken: [] } ]
      responses:
        "200":
          description: The list, who you are, and whether you may manage it (owners only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins: { type: array, items: { type: object, properties: { id: { type: integer, nullable: true, description: "null for an owner." }, email: { type: string }, owner: { type: boolean }, added_at: { type: string, format: date-time, nullable: true } } } }
                  you: { type: string }
                  can_manage: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Designate an administrator (owners only). They are emailed how to sign in; they sign in with a code, as any administrator does.
      security: [ { adminToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "201": { description: Added., content: { application/json: { schema: { type: object, properties: { admin: { type: object, properties: { id: { type: integer }, email: { type: string }, owner: { type: boolean } } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "conflict -- already an administrator.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/admins/{id}:
    delete:
      summary: Remove a designated administrator (owners only). Their sessions end at once. Owners cannot be removed here.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Removed., content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/status:
    get:
      summary: Deployment diagnostics (PHP version, extensions, migrations, mail driver). No secrets.
      security: [ { adminToken: [] } ]
      responses:
        "200": { description: Status., content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
