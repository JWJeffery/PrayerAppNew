<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Anglican Synaxarium — Kalendar Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-title">
    <span class="masthead-eyebrow">Universal Office</span>
    <h1>An Anglican Synaxarium</h1>
  </div>
  <div class="masthead-progress" id="progressWrap">
    <div class="progress-label" id="progressLabel">0 of 0 days decided</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="masthead-actions">
    <span class="file-status" id="fileStatus"></span>
    <button class="btn btn-secondary" id="btnConnectFile">Connect decisions file</button>
    <button class="btn btn-ghost" id="btnImport" title="Load a previously exported decisions file">Import decisions</button>
    <input type="file" id="fileImport" accept=".json" hidden>
    <button class="btn btn-primary" id="btnExport" title="Download all recorded decisions">Export decisions</button>
    <label class="app-dark-toggle"><input type="checkbox" id="toggle-dark-synaxarium" data-app-dark-toggle onchange="setSynaxariumDark(this.checked)"> Dark Mode</label>
  </div>
</header>

<div class="app">
  <nav class="ledger" id="ledger" aria-label="Month and day navigation">
    <div class="month-tabs" id="monthTabs"></div>
    <ol class="day-list" id="dayList"></ol>
  </nav>

  <main class="folio" id="folio">
    <!-- filled by app.js -->
  </main>
</div>

<div class="seal-overlay" id="sealOverlay" aria-hidden="true">
  <svg viewBox="0 0 120 120" class="seal-svg">
    <circle cx="60" cy="60" r="52" class="seal-ring"/>
    <text x="60" y="55" text-anchor="middle" class="seal-text">DECIDED</text>
    <text x="60" y="74" text-anchor="middle" class="seal-text seal-text-small">GOVERNED BY JOSH</text>
  </svg>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script>
/* Appearance for the Synaxarium review tool. This page does not load
   js/office-ui.js, so it cannot use applyDarkMode(); the boot rule is
   reproduced deliberately rather than approximated, matching the rule set for
   the main app on 2026-09-03: honour the OS prefers-color-scheme first, fall
   back to the clock rule (light 06:00-18:00) where the OS expresses no
   preference or the browser lacks matchMedia, and let a stored manual choice
   override both. Nothing re-imposes the OS value mid-session. */
function setSynaxariumDark(dark, persist) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const box = document.getElementById('toggle-dark-synaxarium');
    if (box) box.checked = dark;
    // Only a deliberate choice is stored. Boot passes persist=false, so the
    // OS preference is re-read on every visit rather than being frozen into
    // storage the first time the page is opened.
    if (persist === false) return;
    try { localStorage.setItem('uo-synaxarium-dark', dark ? '1' : '0'); } catch (e) {}
}
(function bootSynaxariumAppearance() {
    let stored = null;
    try { stored = localStorage.getItem('uo-synaxarium-dark'); } catch (e) {}
    if (stored === '1' || stored === '0') { setSynaxariumDark(stored === '1', false); return; }

    let dark = null;
    try {
        if (window.matchMedia) {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) dark = true;
            else if (window.matchMedia('(prefers-color-scheme: light)').matches) dark = false;
        }
    } catch (e) { dark = null; }

    if (dark === null) {
        const h = new Date().getHours();
        dark = !(h >= 6 && h < 18);
    }
    setSynaxariumDark(dark, false);
})();
</script>
</body>
</html>
